name: ms-olivaw-hub-ng-prd
services:
  ms-olivaw-hub-ng:
    container_name: ms-olivaw-hub-ng
    image: ${FRONTEND_IMAGE:-ms-olivaw-hub-ng:prd}
    environment:
      API_URL: ${API_URL:-https://api.olivaw-hub.duckdns.org}
    labels:
      traefik.enable: 'true'
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik-net}
      traefik.http.routers.ms-olivaw-hub-ng-prd.rule: Host(`${PUBLIC_HOST:-olivaw-hub.duckdns.org}`)
      traefik.http.routers.ms-olivaw-hub-ng-prd.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.ms-olivaw-hub-ng-prd.tls: 'true'
      traefik.http.routers.ms-olivaw-hub-ng-prd.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-myresolver}
      traefik.http.routers.ms-olivaw-hub-ng-prd.service: ms-olivaw-hub-ng-prd
      traefik.http.services.ms-olivaw-hub-ng-prd.loadbalancer.server.port: '8080'
      traefik.http.services.ms-olivaw-hub-ng-prd.loadbalancer.server.scheme: http
