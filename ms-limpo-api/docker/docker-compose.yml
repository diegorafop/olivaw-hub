services:
    ms-limpo-api:
        restart: unless-stopped
        env_file:
            - ./.env
        build:
            context: ../
            dockerfile: src/Mps.Limpo.Api/Dockerfile
            args:
                - GITEA_API_KEY=${GITEA_API_KEY}
        networks:
            - holos-net
            - postgres-net
        cgroup_parent: "holos-docker.slice"
networks:
    holos-net:
        driver: bridge
        external: true
        name: holos-net

    postgres-net:
        driver: bridge
        external: true
        name: postgres-net
