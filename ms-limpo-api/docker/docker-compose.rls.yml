services:
    ms-limpo-api:
        container_name: ms-limpo-api-rls
        image: registry.mps.com.br/holos/ms-limpo-api:rls
        build:
            args:
                - BUILD_CONFIG=Release
                - SKIP_UNITARY_TESTS=false
                - SKIP_EF_SCHEMA_SCRIPT=true
                - HTTP_PORT=80
                - HTTPS_PORT=443
        environment:
            - ASPNETCORE_ENVIRONMENT=Release
        labels:
            - traefik.http.routers.limpo-api-rls.rule=Host(`limpo-api.rls.holos.mps.com.br`)
            - traefik.http.routers.limpo-api-rls.entrypoints=ms-holos-web-secure
            - traefik.http.routers.limpo-api-rls.tls=true
            - traefik.http.routers.limpo-api-rls.tls.certresolver=lets-encrypt
            - traefik.docker.network=holos-net