services:
    ms-limpo-api:
        container_name: ms-limpo-api-latest
        image: registry.mps.com.br/holos/ms-limpo-api:latest
        build:
            args:
                - BUILD_CONFIG=Debug
                - HTTP_PORT=80
                - HTTPS_PORT=443
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
        ports:
            - 44324:80
            - 44325:443