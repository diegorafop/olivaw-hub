name: ms-olivaw-api-prd
services:
  ms-olivaw-api:
    container_name: ms-olivaw-api-prd
    image: ms-olivaw-api:prd
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    labels:
      traefik.enable: 'true'
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik-net}
      traefik.http.routers.ms-olivaw-api-prd.rule: Host(`${PUBLIC_HOST:-api.olivaw-hub.duckdns.org}`)
      traefik.http.routers.ms-olivaw-api-prd.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.ms-olivaw-api-prd.tls: 'true'
      traefik.http.routers.ms-olivaw-api-prd.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-myresolver}
      traefik.http.routers.ms-olivaw-api-prd.service: ms-olivaw-api-prd
      traefik.http.services.ms-olivaw-api-prd.loadbalancer.server.port: '8080'
      traefik.http.services.ms-olivaw-api-prd.loadbalancer.server.scheme: http
