<aside class="controls" aria-label="Explore sua ideia">
  <div class="control-heading">
    <span>Seu ponto de partida</span
    ><button type="button" (click)="resetRequested.emit()">Recomeçar</button>
  </div>
  <h2>Comece com uma ideia.</h2>
  <p class="control-hint">O que você quer criar? Explore uma possibilidade.</p>
  <div class="preset-list">
    @for (preset of presets; track preset.id) {
      <button
        type="button"
        class="preset-option"
        [attr.aria-pressed]="activePreset().id === preset.id"
        (click)="presetChange.emit(preset.id)"
      >
        <span class="choice-mark" aria-hidden="true">{{
          activePreset().id === preset.id ? '●' : '○'
        }}</span
        ><span
          ><strong>{{ preset.label }}</strong
          ><small>{{ preset.subtitle }}</small></span
        ><span aria-hidden="true">↗</span>
      </button>
    }
  </div>
  <div class="blocks-heading">
    <span class="step-dot">+</span>
    <div>
      <h2>O que faria sentido para você?</h2>
      <p class="control-hint">Experimente adicionar e remover possibilidades.</p>
    </div>
  </div>
  <div class="block-options">
    @for (block of options(); track block.id) {
      <button
        type="button"
        class="block-option"
        [attr.aria-pressed]="selectedBlocks().includes(block.id)"
        (click)="blockToggle.emit(block.id)"
      >
        <span
          ><strong>{{ block.label }}</strong
          ><small>{{ block.description }}</small></span
        ><span class="selection-state"
          ><span aria-hidden="true">{{ selectedBlocks().includes(block.id) ? '✓' : '+' }}</span
          >{{ selectedBlocks().includes(block.id) ? 'Adicionado' : 'Adicionar' }}</span
        >
      </button>
    }
  </div>
  <button type="button" class="review-button" (click)="continueRequested.emit()">
    Quero criar do meu jeito <span aria-hidden="true">↗</span>
  </button>
</aside>
