server {
    listen 8080;
    server_name olivaw.com.br;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /health { access_log off; return 200 'ok'; }
    location = /config.json { expires -1; alias /tmp/olivaw/config.json; }
    location = /index.html { expires -1; try_files $uri =404; }
    location = /index.csr.html { expires -1; try_files $uri =404; }
    # Este serviço entrega somente frontend; não encaminha chamadas de API.
    location ~ /\. { deny all; }
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico|webp|avif|json|map|txt|xml)$ {
        expires 1h;
        try_files $uri =404;
    }
    # / tem HTML prerenderizado; rotas internas usam o shell CSR, sem conteúdo público transitório.
    location / { expires -1; try_files $uri $uri/ /index.csr.html; }
}
