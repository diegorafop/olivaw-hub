[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ms-limpo-py"
version = "0.1.0"
description = "Template Python para agentes locais com CQS"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
ms-limpo = "ms_limpo.cli:main"
ms-limpo-migrate = "ms_limpo.data.apply_migrations:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ms_limpo = ["data/migrations/*.sql"]
