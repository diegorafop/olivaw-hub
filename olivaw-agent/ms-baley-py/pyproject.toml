[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ms-baley-py"
version = "0.1.0"
description = "Agente de segurança Baley para hosts Docker"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
baley = "ms_baley.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

