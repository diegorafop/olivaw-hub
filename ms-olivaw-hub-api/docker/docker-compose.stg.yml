name: ms-olivaw-hub-api-stg
services:
  ms-olivaw-hub-api:
    container_name: ms-olivaw-hub-api-stg
    image: ms-olivaw-hub-api:stg
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
    labels:
      traefik.enable: 'true'
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik-net}
      traefik.http.routers.ms-olivaw-hub-api-stg.rule: Host(`${PUBLIC_HOST:-api.olivaw-hub-stg.duckdns.org}`)
      traefik.http.routers.ms-olivaw-hub-api-stg.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.ms-olivaw-hub-api-stg.tls: 'true'
      traefik.http.routers.ms-olivaw-hub-api-stg.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-myresolver}
      traefik.http.routers.ms-olivaw-hub-api-stg.service: ms-olivaw-hub-api-stg
      traefik.http.services.ms-olivaw-hub-api-stg.loadbalancer.server.port: '8080'
      traefik.http.services.ms-olivaw-hub-api-stg.loadbalancer.server.scheme: http
