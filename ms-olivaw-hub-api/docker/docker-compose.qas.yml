name: ms-olivaw-hub-api-qas
services:
  ms-olivaw-hub-api:
    container_name: ms-olivaw-hub-api-qas
    image: ms-olivaw-hub-api:qas
    environment:
      ASPNETCORE_ENVIRONMENT: Quality
    labels:
      traefik.enable: 'true'
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik-net}
      traefik.http.routers.ms-olivaw-hub-api-qas.rule: Host(`${PUBLIC_HOST:-api.olivaw-hub-qas.duckdns.org}`)
      traefik.http.routers.ms-olivaw-hub-api-qas.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.ms-olivaw-hub-api-qas.tls: 'true'
      traefik.http.routers.ms-olivaw-hub-api-qas.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-myresolver}
      traefik.http.routers.ms-olivaw-hub-api-qas.service: ms-olivaw-hub-api-qas
      traefik.http.services.ms-olivaw-hub-api-qas.loadbalancer.server.port: '8080'
      traefik.http.services.ms-olivaw-hub-api-qas.loadbalancer.server.scheme: http
