name: ms-ltmj-ng-stg
services:
  ms-ltmj-ng:
    container_name: ms-ltmj-ng-stg
    image: ${FRONTEND_IMAGE:-ms-ltmj-ng:stg}
    environment:
      API_URL: ${API_URL:-https://api.ltmj-stg.olivaw.com.br}
    labels:
      traefik.enable: 'true'
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik-net}
      traefik.http.routers.ms-ltmj-ng-stg.rule: Host(`${PUBLIC_HOST:-ltmj-stg.olivaw.com.br}`)
      traefik.http.routers.ms-ltmj-ng-stg.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.ms-ltmj-ng-stg.tls: 'true'
      traefik.http.routers.ms-ltmj-ng-stg.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-myresolver}
      traefik.http.routers.ms-ltmj-ng-stg.service: ms-ltmj-ng-stg
      traefik.http.services.ms-ltmj-ng-stg.loadbalancer.server.port: '8080'
      traefik.http.services.ms-ltmj-ng-stg.loadbalancer.server.scheme: http
