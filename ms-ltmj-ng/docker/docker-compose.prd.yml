name: ms-ltmj-ng-prd
services:
  ms-ltmj-ng:
    container_name: ms-ltmj-ng-prd
    image: ${FRONTEND_IMAGE:-ms-ltmj-ng:prd}
    environment:
      API_URL: ${API_URL:-https://api.ltmj.olivaw-hub.duckdns.org}
    labels:
      traefik.enable: 'true'
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik-net}
      traefik.http.routers.ms-ltmj-ng-prd.rule: Host(`${PUBLIC_HOST:-ltmj.olivaw-hub.duckdns.org}`)
      traefik.http.routers.ms-ltmj-ng-prd.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.ms-ltmj-ng-prd.tls: 'true'
      traefik.http.routers.ms-ltmj-ng-prd.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-myresolver}
      traefik.http.routers.ms-ltmj-ng-prd.service: ms-ltmj-ng-prd
      traefik.http.services.ms-ltmj-ng-prd.loadbalancer.server.port: '8080'
      traefik.http.services.ms-ltmj-ng-prd.loadbalancer.server.scheme: http
