global
  maxconn 32
  nbthread 1

defaults
  mode http
  timeout connect 3s
  timeout client 1h
  timeout server 1h
  timeout http-request 5s
  timeout http-keep-alive 10s

frontend docker_readonly
  bind :2375
  acl read_method method GET
  acl ping_method method HEAD
  acl ping_path path_reg ^(/v[0-9]+\.[0-9]+)?/_ping$
  acl discovery_path path_reg ^(/v[0-9]+\.[0-9]+)?/(_ping|version|events|containers/json|containers/[a-f0-9]{12,64}/json)$
  http-request deny deny_status 403 unless read_method discovery_path or ping_method ping_path
  default_backend docker_socket

backend docker_socket
  server docker /var/run/docker.sock
