services:
    ms-auth-api:
        container_name: ms-auth-api-qas
        image: registry.mps.com.br/holos/ms-auth-api:qas
        build:
            args:
                - BUILD_CONFIG=Release
                - SKIP_UNITARY_TESTS=false
                - SKIP_EF_SCHEMA_SCRIPT=true
                - HTTP_PORT=80
                - HTTPS_PORT=443
        environment:
            - ASPNETCORE_ENVIRONMENT=Quality
        labels:
            - traefik.http.routers.auth-api-qas.rule=Host(`auth-api.qas.holos.mps.com.br`)
            - traefik.http.routers.auth-api-qas.entrypoints=ms-holos-web-secure
            - traefik.http.routers.auth-api-qas.tls=true
            - traefik.http.routers.auth-api-qas.tls.certresolver=lets-encrypt
            - traefik.docker.network=holos-net