services:
    ms-auth-api:
        container_name: ms-auth-api-lch
        image: registry.mps.com.br/holos/ms-auth-api:lch
        build:
            args:
                - BUILD_CONFIG=Release
                - SKIP_UNITARY_TESTS=true
                - SKIP_EF_SCHEMA_SCRIPT=true
                - HTTP_PORT=80
                - HTTPS_PORT=443
        environment:
            - ASPNETCORE_ENVIRONMENT=Localhost
        labels:
            - traefik.http.routers.auth-api-lch.rule=Host(`auth-api.lch.holos.mps.com.br`)
            - traefik.http.routers.auth-api-lch.entrypoints=ms-holos-web-secure
            - traefik.http.routers.auth-api-lch.tls=true
            - traefik.http.routers.auth-api-lch.tls.certresolver=lets-encrypt
            - traefik.docker.network=holos-net