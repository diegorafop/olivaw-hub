services:
    ms-auth-api:
        container_name: ms-auth-api-dev
        image: registry.mps.com.br/holos/ms-auth-api:dev
        build:
            args:
                - BUILD_CONFIG=Release
                - SKIP_UNITARY_TESTS=false
                - SKIP_EF_SCHEMA_SCRIPT=true
                - HTTP_PORT=80
                - HTTPS_PORT=443
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
        labels:
            - traefik.http.routers.auth-api-dev.rule=Host(`auth-api.dev.holos.mps.com.br`)
            - traefik.http.routers.auth-api-dev.entrypoints=ms-holos-web-secure
            - traefik.http.routers.auth-api-dev.tls=true
            - traefik.http.routers.auth-api-dev.tls.certresolver=lets-encrypt
            - traefik.docker.network=holos-net